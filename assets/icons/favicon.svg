<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark Cockpit Base Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Neon Cyber Cyan Silhouette Gradient -->
    <linearGradient id="unicornCyan" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#e0faff"/>
      <stop offset="30%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Cyber Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Cockpit Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#162032" stroke-width="1.5"/>
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="#00f3ff" stroke-width="0.8" opacity="0.35"/>

  <!-- Standalone RX-0 Cyber Unicorn Silhouette (No HUD Rings) -->
  <path d="M 9.6 6 L 24.3 19.5 L 24.7 18.3 L 23.5 14.3 L 23.5 10 L 24.3 12.7 L 29 17.5 L 38.2 19.9 L 44.1 23.5 L 46.1 25.8 L 51.3 35.4 L 55.6 48.1 L 55.6 48.9 L 53.2 50.1 L 52.4 51.3 L 46.1 54.4 L 41.3 56.4 L 34.6 58 L 28.2 57.6 L 23.9 56 L 19.9 53.6 L 19.5 53.2 L 21.1 49.3 L 28.2 38.9 L 28.6 37 L 27 36.6 L 23.1 38.2 L 19.9 40.5 L 17.5 41.3 L 14.7 44.1 L 12.4 43.7 L 9.2 41.7 L 8.4 38.9 L 8.8 36.2 L 17.5 28.6 L 21.1 23.1 L 9.6 6.4 Z" fill="url(#unicornCyan)" filter="url(#neonGlow)"/>
</svg>
